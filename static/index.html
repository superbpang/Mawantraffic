<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>馬灣交通</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <h1>馬灣交通</h1>
    <p id="clock" class="clock" aria-live="polite"><span id="day"></span><strong id="time">正在讀取</strong><span id="fail"></span></p>
  </header>
  <main>
    <section id="alerts" class="alerts" aria-live="polite"></section>
    <details class="fold panel direction" data-id="leave" open>
      <summary>
        <span class="name">離開馬灣</span>
        <span id="leave-summary" class="aside"></span>
      </summary>
      <div id="leave" class="stops"></div>
    </details>
    <details class="fold panel direction" data-id="back" open>
      <summary>
        <span class="name">往馬灣</span>
        <span id="back-summary" class="aside"></span>
      </summary>
      <div id="back" class="stops"></div>
    </details>
    <details id="road" class="fold panel" data-id="road">
      <summary>
        <span class="name">路面</span>
        <span id="road-summary" class="aside"></span>
      </summary>
      <div class="more">
        <div id="road-body"></div>
        <p class="label">閉路電視</p>
        <div id="cameras" class="cameras"></div>
        <div id="camera-gaps" class="camera-gaps"></div>
      </div>
    </details>
  </main>
  <footer>
    <p>渡輪及居民巴士只顯示開出時間，不顯示船隻或巴士位置。九巴有到站時間時，才顯示到達時間。</p>
  </footer>
  <script src="/app.js"></script>
</body>
</html>
